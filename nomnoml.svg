	<desc >#direction: down
	#spacing: 60
	#padding: 12
	#ranker: longest-path
	
	[&lt;abstract&gt; Pessoa |
	  + nome: string
	  - _cpf: string
	  + idade: int |
	  + get_cpf(): string
	]
	
	[Medico |
	  - _crm: string
	  + espec: string |
	  + atender()
	]
	
	[&lt;abstract&gt; Paciente |
	  - _sintomas: string |
	  + gerar_conta(): float
	]
	
	[PacienteParticular |
	  - _valor_consulta: float
	  - _eh_retorno: bool |
	  + gerar_conta(): float
	]
	
	[PacienteConvenio |
	  - _nomePlano: string
	  - _numeroCarteirinha: string |
	  + gerar_conta(): float
	]
	
	[Triagem |
	  - _temperatura: float
	  - _pressaoSistolica: int
	  - _nivel_dor: int
	  - _cor_risco: string
	  - _peso_prioridade: int |
	  + calcular_risco()
	  + exibir_triagem()
	]
	
	[Consulta |
	  - _data_hora: datetime
	  - _diagnostico: string
	  - _receita: string |
	  + exibir_resumo()
	]
	
	// 1. Relações de Herança (Seta vazada &lt;:-)
	[Pessoa] &lt;:- [Medico]
	[Pessoa] &lt;:- [Paciente]
	[Paciente] &lt;:- [PacienteParticular]
	[Paciente] &lt;:- [PacienteConvenio]
	
	// 2. Relações de Associação Simples (Invertidas no código para não cruzar linhas)
	[Medico] &lt;- [Consulta]
	[Paciente] &lt;- [Consulta]
	[Consulta] -&gt; [Triagem]</desc>
